[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftback"
version = "1.0.0"
description = "Training-free correction of workpiece layout changes for imitation-learned manipulation policies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "pillow>=8"]

[project.optional-dependencies]
localiser = ["torch>=2.0", "transformers>=4.40"]
demo = ["matplotlib>=3.5", "imageio>=2.20"]

[tool.setuptools]
packages = ["shiftback"]
